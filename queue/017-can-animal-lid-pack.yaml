description: 'Turn any soda can into a little animal. A snap-on cover that keeps bugs, dust and spills
  out of your drink, with a cat, frog, bat or bear face on top. Four animals, three can sizes.


  **Included (12 STL files, ready to print)**


  - Cat, frog, bat and bear

  - Each one for standard 12 oz cans (202 end, 54 mm), slim 8 oz cans (200 end, 50.8 mm) and sleek cans
  (204 end, 57.2 mm)

  - Plus a print-ready 3MF bundle


  **Print settings**


  - No supports: print with the animal face on the bed (as oriented)

  - 0.2 mm layers, 3 walls, 15 % infill

  - PETG recommended: the snap bead flexes slightly instead of cracking

  - Single colour is fine; the face is engraved lines, so no multi-colour setup is needed


  **Sized to can-end standards**


  - Inner diameter = can end size + 0.8 mm for FDM tolerance (202 = 2 2/16 in, 200 = 2 0/16 in, 204 =
  2 4/16 in)

  - Snap bead sits just under the can seam

  - The ears, wings and frog eyes are flat parts in the same plane as the lid top, so everything prints
  without supports


  **Note:** can makers vary by a fraction of a millimetre, so check your brand with one lid first. If
  it is loose or tight, tell me the can and I will adjust it. The wings of the bat are about 103 mm wide
  in total.

  '
