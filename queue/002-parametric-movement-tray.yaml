description: 'Move whole squads in one go and stop knocking miniatures over. Eight
  ready-to-print trays for the most common round base sizes, with optional magnet
  pockets.


  **Included trays**

  - 25 mm bases: 5×2, 5×2 with pockets for 5×2 mm magnets, 4×4 regiment block

  - 28.5 mm bases (sold as "28 mm"): 5×2

  - 32 mm bases: 5×2, 5×2 with pockets for 6×2 mm magnets, 3×2 staggered skirmish
  formation

  - 40 mm bases: 3×2


  **Details**

  - 0.6 mm clearance so bases drop in and lift out easily

  - Chamfered pockets and rim, finger notches on both sides

  - Magnet version fits 5 × 2 mm neodymium magnets (glue them in)

  - Compatible with any game that uses round bases


  **Print settings**

  - No supports, print flat

  - 0.2 mm layers, 3 walls, 15 % infill, about 10–25 g per tray

  - PLA or PETG; a dark or textured bed plate looks great on the table


  Need another base size or layout? Leave a comment and I will add it for free.


  **Sized to real-world standards**

  - Pockets for the standard round bases used by Games Workshop and most wargames:
  25, 28.5, 32 and 40 mm

  - Pocket diameters are compensated for polygon facets, so the real clearance is
  0.6 mm, not less

  '
