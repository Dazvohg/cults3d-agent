description: 'Keep your mate upright in the car. A tapered plug drops into the car cup holder and a wider well on top holds a steel mate, so it does not tip over in curves.


  **Adaptador de posavasos para mate:** el mate queda firme en el auto. Entra en el posavasos y arriba sostiene mates de acero de 8 cm (Stanley, Hudson, Coleman).


  **Included (3 files, pick your cup holder size)**


  - Plug 72 mm (most common cup holders)

  - Plug 66 mm (narrow cup holders)

  - Plug 78 mm (wide cup holders)


  Each plug is 3 mm narrower at the bottom and has 4 slits so it flexes a little and grips. On top: mate well 86 mm wide and 45 mm deep with 3 drain holes.


  **Check first**


  Measure the top of your car cup holder: pick the plug equal to it or up to 2 mm smaller. Mate up to 84 mm at the bottom (Stanley and Hudson steel mates are 80 mm, according to their published sizes).


  **Print settings**


  - No supports: prints upright as oriented (gentle flare and pointed roof inside the plug)

  - 0.2 mm layers, 3 walls, 15 % infill

  - PETG or ASA. A car in the sun softens PLA


  **Honest note:** brand names only describe compatibility; this is not an official accessory. Do not drink hot mate while driving.

  '
