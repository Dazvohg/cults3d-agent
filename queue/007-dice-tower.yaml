description: 'A dice tower that actually works for big dice. Every ramp leaves a 31 mm gap, so a d20 (up
  to 29 mm) never jams, and the dice land in a rolling tray with a rim.


  **Included (2 files)**

  - Tall tower, 3 ramps (76 x 112 x 192 mm)

  - Compact tower, 2 ramps (76 x 112 x 146 mm)


  **Print settings**

  - Ramps are 45 degrees and the exit window is a gable, so support needs are minimal (see the slicer notes below)

  - 0.2 mm layers, 3 walls, 15 % infill

  - PLA or PETG


  **Sized to real-world standards**

  - Chamber 70 x 36 mm, gap 31 mm vs d20 23-29 mm

  - Footprint fits a 220 mm bed


  Great for D&D, Pathfinder, board games and wargames.

  '
