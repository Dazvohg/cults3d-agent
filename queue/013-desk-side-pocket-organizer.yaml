description: 'Five pockets that stick to the side or underside of a desk, a shelf or a wall, so phone,
  pens, remote and keys stay off the table. Each has a flat back for double-sided tape and two screw holes
  with a counterbore.


  **Included (5 files)**


  - Phone pocket, 82 x 13 mm slot (phone with a normal case)

  - Phone pocket for rugged cases, 82 x 18 mm slot

  - Pen cup, 48 x 48 mm, 90 mm tall (about 20 pens)

  - Wide tray for remotes, glasses or cables, 120 x 45 mm, 35 mm tall

  - Small pocket for keys or earbuds, 60 x 30 mm, 40 mm tall


  **Print settings**


  - No supports: print standing, as oriented

  - 0.2 mm layers, 3 walls, 15 % infill

  - PETG or PLA


  **How to mount**


  - Adhesive: clean the surface, stick strong double-sided foam tape (not included) on the flat back,
  press for 30 seconds

  - Screws: two screw holes with a counterbore for 4 mm screws (not included). Use screws for heavy loads

  - Adhesive strength depends on the tape and the surface. Test it with a light load first and do not
  hang anything heavy or fragile


  **Sizes**


  - Walls 1.6 mm, floor 2.4 mm, mounting plate 3.2 mm

  - Phone slots: 13 mm for a phone plus normal case (7.5-9 mm phones), 18 mm for rugged cases (15-17 mm);
  82 mm wide fits the iPhone 16 Pro Max (77.6 mm wide)

  - Every pocket is open at the top and stands on its own floor in the printer

  '
