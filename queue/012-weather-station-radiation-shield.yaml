description: 'A passive solar radiation shield for outdoor temperature and humidity sensors. Louver plates
  stacked on three threaded rods keep direct sun and rain off the sensor while letting air flow through,
  so the reading follows the air instead of the sun.


  **Included (5 files)**


  - Louver plate: print 5 (the file holds 1 plate)

  - Cap (roof): print 1

  - Spacers: 18 sleeves on one plate, print 1

  - Base for a DHT22 / AM2302 sensor (6 mm cable hole through the floor)

  - Base for a 6 mm DS18B20 stainless probe


  **You also need**


  - 3 x M4 threaded rod, 100 mm

  - 6 x M4 nuts and 6 x M4 washers

  - A zip tie or sealant to fix the sensor


  **Print settings**


  - No supports: every part prints as oriented

  - 0.2 mm layers, 3 walls, 15 % infill

  - Print in white or light grey ASA or PETG. Dark or plain PLA absorbs sun and softens outdoors

  - Whole kit: about 11 hours of printing and 290 g of filament (5 plates, cap, spacers and one base)


  **Dimensions**


  - 116 mm wide, about 90 mm tall once stacked (rod ends sticking out a little more)

  - Plate pitch 14 mm, cones at 50 degrees, 40 mm central chimney for the sensor

  - DHT22 pocket 15.7 x 25.6 mm for the 15.1 x 25 x 7.7 mm sensor body

  - Probe hole 6.4 mm for a 6 mm stainless probe

  - Rod holes 4.5 mm for M4


  **Honest note:** this is a passive louver design. It reduces solar heating of the sensor, but I have
  not measured it against a reference thermometer, so do not use it for certified measurements. Mount
  it in open air, away from walls and roofs.

  '
