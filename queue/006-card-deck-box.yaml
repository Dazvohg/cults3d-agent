description: 'Keep your deck safe in a box made for sleeved cards. A snug base with a sliding cap, a thumb
  notch to lift the stack, and four sizes sized from real card dimensions.


  **Included (8 files = 4 boxes, each a base and a cap)**

  - Standard TCG / poker (66 x 91 mm sleeved), 100 cards (Commander-size)

  - Standard TCG / poker (66 x 91 mm sleeved), 60 cards

  - Mini Euro (47 x 71 mm sleeved), 60 cards

  - Tarot (73 x 123 mm sleeved), 60 cards


  **Print settings**

  - No supports: both parts print open side up

  - 0.2 mm layers, 3 walls, 15 % infill

  - PLA or PETG


  **Sized to real-world standards**

  - Inner space = sleeved card + 1 mm play. Each sleeved card is counted as 0.65 mm thick, so double-sleeved
  decks need a larger count

  - Cap fits over the base with 0.3 mm gap per side (friction fit, no glue)


  Perfect for Magic, Pokemon, board game and D&D spell-card decks.

  '
