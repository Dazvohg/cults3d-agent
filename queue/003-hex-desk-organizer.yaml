description: 'A clean honeycomb organizer for pens, brushes, tools and makeup. Cells
  of different heights make everything easy to reach and look great on any desk.


  **What you get**

  - 5-cell cluster (188 × 128 × 100 mm)

  - 3-cell cluster

  - 7-cell cluster (smaller 50 mm cells, fits a 220 × 220 bed)

  - Single hex cup, print as many as you like


  **Print settings**

  - No supports, no brim needed

  - 0.2 mm layers, 2–3 walls, 10–15 % infill

  - PLA or PETG. Try vase-mode-like multicolor filament for a great look

  - Small bottom chamfer to prevent elephant''s foot


  Designed and tested for FDM printers with a 220 × 220 mm bed or larger.

  '
