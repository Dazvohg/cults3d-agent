description: 'Warm, glowing decor for your shelf or table: three original holders for flameless LED tea
  lights. A diamond-lattice holder, a vertical-slot holder and a low faceted cup, each in two sizes. Plain
  geometric shapes with no logos.



  **LED tea lights only. Do not use a real flame or a hot candle: PLA softens and can burn.**



  **Included (6 STL files)**



  - Diamond lattice holder, 56 mm tall (three staggered rows of diamond windows)


  - Vertical slot holder, 50 mm tall (12 narrow pointed slots)


  - Faceted twisted cup, 30 mm tall


  - Each in two sizes: 38 mm (the common LED tea light) and 43 mm (large LED tea lights)



  **Print settings**



  - No supports: print upright with the open end up; the diamond windows and the slots have 45 degree
  pointed tops


  - 0.2 mm layers, 3 walls, 10 % infill


  - White, natural or translucent PLA lets the most light through; a darker colour gives crisp shadows



  **Notes**



  - The pocket is 3 mm wider than the tea light (41 mm for the 38 mm size, 46 mm for the 43 mm size).
  Measure your own tea light before printing


  - Every pocket has a 3 mm floor; the light sits at the bottom and shines through the windows or slots,
  or from the top in the faceted cup


  - Works for autumn, winter and Christmas decor, weddings and everyday shelf styling

  '
