description: 'A two-part clamp that grips the cable and gives you two eyes for a padlock or a chain. Fix
  it to the cable near the plug and chain it to a post, a ring or the charger bracket, and a casual thief
  has to stop and cut it.


  **Please read this first**


  - This is a plastic part. It is a visible deterrent, NOT a security lock. A determined person cuts it
  in seconds. The real protection is the steel chain and padlock that you add

  - It does not lock the plug into the car. It holds the cable


  **Included (8 files, one per cable size)**


  - Cable diameters 12, 14, 16, 18, 20, 22, 24 and 26 mm

  - Each file has both halves on one plate. Print it once and you have the full collar


  **You also need (not included)**


  - 2 bolts M5 x 35 mm with nuts (the head sits in a round pocket, the nut in a hex pocket)

  - A padlock or a chain. The eyes are 13 mm wide, so a shackle up to 10 mm passes through


  **How to choose the size**


  - Measure the outside diameter of your cable with calipers, or wrap a string once around it and divide
  the length by 3.14

  - Take the file with the same number. The bore is 0.6 mm smaller than the cable so that the halves grip
  the jacket

  - A strip of rubber from a bicycle inner tube between cable and collar gives more grip

  - Cable sizes vary a lot between brands and between 16 A and 32 A cables. This listing does NOT claim
  a fit for any car or charger model. Message me your measurement if it is between sizes


  **Print settings**


  - No supports: flat on the bed, outer side up, as oriented

  - 0.2 mm layers, 5 walls, 30 % infill

  - PETG or ASA for outdoors. PLA is not recommended in the sun

  '
