description: 'A football (soccer) trophy you can print and paint gold: a ball with engraved panels on
  a plinth, and a football cleat on its own plinth. Both plinths come with an engraved name plate text,
  or blank. For club prizes, kids'' leagues, office five-a-side or a gift. Original shapes, with no award
  names, logos or likenesses.


  **Included (8 STL files)**


  - Ball: two hemispheres (print the file twice) that make a 60 mm ball, with engraved pentagon panels,
  plus 3 alignment pins

  - Ball plinth in 3 versions: CHAMPION, MVP and blank

  - Cleat (football boot) silhouette, 16 mm thick, with studs and 2 locating tabs

  - Boot plinth in 2 versions: TOP SCORER and blank


  **Print settings**


  - No supports: the ball halves print dome-up on their flat face, the boot prints lying on its side,
  the plinths print as they are

  - 0.2 mm layers, 3 walls, 10-15 % infill

  - Gold or silk PLA looks great; or print in any colour and spray paint

  - Glue the two ball halves together with the pins; the ball sits 5 mm deep in the plinth dish, the boot
  plugs into the plinth slots


  **Notes**


  - The assembled ball is 60 mm across; the ball plinth is 120 x 100 x 16 mm and the boot plinth 140 x
  60 x 16 mm

  - Text is engraved 1.2 mm deep; use the blank plinth to add your own label, vinyl or sticker

  '
