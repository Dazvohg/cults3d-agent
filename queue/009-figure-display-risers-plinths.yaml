description: 'Give your action figures, models and collectibles a proper stage. A set of stepped risers
  and plinths for shelves and desks, sized for 15 cm (6 in) figures. Plain surfaces, so they suit any
  figure or collection.


  **Included (7 STL files)**


  - 3-step riser, 150 mm wide (steps 40 mm deep, 18 mm rise)

  - 3-step riser, 200 mm wide

  - 4-step riser, 150 mm wide (16 mm rise)

  - Round plinths: 60, 80 and 100 mm

  - Hexagonal plinth: 90 mm across corners


  **Print settings**


  - No supports: everything prints flat on its base

  - 0.2 mm layers, 3 walls, 15 % infill (the risers are solid shapes, so use low infill to save filament)

  - PLA is fine; add a thin sheet of felt or cork underneath if you want a non-slip base


  **Notes**


  - Each step is 40 mm deep, enough for the feet of a typical 15 cm figure; check your own figure''s feet
  before printing the large riser

  - The plinths have a 45 degree top chamfer and a fine decorative groove

  - These are plain display pieces, not tied to any brand or character

  '
