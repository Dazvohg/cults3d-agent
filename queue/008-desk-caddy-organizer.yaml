description: |
  A desk organizer that keeps pens, your phone, sticky notes and business cards in one tidy block. Three layouts, plus a version of each for rugged phone cases.

  **Included (5 files)**

  - Full: pen cup, phone slot, sticky-note pad pocket
  - Full, with an 18 mm phone slot for rugged cases
  - Work: two pen cups, sticky-note pad, business-card slot
  - Phone dock: phone slot, small dish for keys or clips, pen cup
  - Phone dock with the 18 mm slot

  **Print settings**

  - No supports, print as oriented
  - 0.2 mm layers, 3 walls, 10 % infill
  - Walls 1.6 mm, floor 2.4 mm

  **Sized to real-world standards**

  - Sticky-note pocket 77.4 mm: fits the standard 3 x 3 in (76.2 mm) pad
  - Business-card slot 90 x 9 mm: fits 88.9 x 50.8 mm (3.5 x 2 in) cards, about 30 of them
  - Phone slot 13 mm (phone plus a normal case, 7.5-9 mm phones) or 18 mm for rugged cases; 82 mm long, enough for the iPhone 16 Pro Max (77.6 mm wide)
  - Pen cup 48 x 48 mm: about 20 ballpoint pens
