description: 'A cup-holder insert that turns a drinks holder into a small organizer: a round cup for coins
  or keys, a slot for cards, and two pockets for a pen and a lip balm. It stands in the holder by itself,
  no glue or tools.


  **Included (6 files, one per cup holder size)**


  - For cup holders with an inside diameter of 66, 69, 72, 75, 78 and 81 mm

  - Each insert is 1.0 mm smaller than that number, 80 mm tall


  **How to choose the size**


  - Measure the inside diameter of your cup holder at the narrowest point. Many are tapered, so measure
  at the top and about 50 mm down and use the smaller number

  - Take the file with the closest number that is not bigger than your measurement

  - This listing is sized by measurement, not by car model. I could not verify the cup-holder size of
  specific models from public sources, so I do not claim that it fits any particular car. Message me the
  measurement and I can make one for it


  **What is in the insert**


  - Coin or key cup, about 90 % of the radius in diameter

  - Card slot, 56 x 8 mm (a bank card is 54 mm wide and 0.8 mm thick)

  - Two round pockets, 14 mm, for a pen or a lip balm

  - 45 degree lead-in at the bottom so it drops into tapered holders


  **Print settings**


  - No supports: print standing, open side up, as oriented

  - 0.2 mm layers, 3 walls, 15 % infill

  - PETG or ASA for a hot car. PLA can soften in a closed car in summer

  '
