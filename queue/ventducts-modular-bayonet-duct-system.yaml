description: 'A modular twist-lock duct system. Every part has a male spigot on one end and a socket on
  the other, so you push them together and twist about 30 degrees to lock. Build your own ducting run
  for a grow tent, a workshop fan, a 3D-printer enclosure or a small extractor.


  **Included (12 files, 3 sizes)**


  - Sizes 100 mm (4 in), 125 mm (5 in) and 150 mm (6 in)

  - Straight part, 100 mm of tube between the ends (166 mm tall in total)

  - Short straight part, 50 mm of tube

  - End cap that locks onto any socket of its size

  - Three reducers: 100 mm male to 125 mm socket, 125 to 150 and 100 to 150


  **Print settings**


  - No supports: print standing, male end down, as oriented

  - 0.2 mm layers, 4 walls, 15 % infill

  - PETG or ASA for warm air. PLA softens around 55 C


  **How the sizes work**


  - The male spigot is the nominal size minus 0.6 mm, so it slides INTO a duct or fan outlet of that inside
  diameter. Measure yours first: 100, 125 and 150 mm are the usual metric sizes, but flexible ducts vary

  - The socket is 0.4 mm bigger all around than the spigot, with three lugs and three L-shaped grooves

  - If your duct is a different size, message me the measurement and I can make the set for it


  **Good to know**


  - There are no elbows in this set: for a turn, join two parts with a flexible duct. Elbows would need
  supports and I only list what prints cleanly

  - The twist-lock holds the parts together but it is not airtight. Seal the joints with aluminium tape
  if you need that

  - Not for dryer exhaust, flues or any hot or combustible exhaust

  - Fit depends on your printer. If the parts are tight, scale the lugs or sand them lightly

  '
