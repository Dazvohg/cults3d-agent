description: 'Color-code your keys, bags and gear with a set of flat, original key tags. Each tag has
  a key ring hole and a raised border; the text is raised 1 mm so it reads well in a two-colour print.
  Plain shapes with no logos, so they suit any home, workshop or small business.



  **Included (14 STL files)**



  - Rectangular key tags, 60 x 28 x 4 mm: HOME, CAR, OFFICE, SHED, SPARE, MAIL and a blank one


  - Round key tags, 36 mm: numbers 1, 2, 3 and 4, plus a blank one


  - Hexagonal blank tag, 40 mm across corners


  - Luggage / bag tag, 95 x 60 x 3 mm: a 4 x 24 mm strap slot and a 1 mm recess (62 x 40 mm) for a printed
  or handwritten name card



  **Print settings**



  - No supports: every tag prints flat on the bed with the text facing up


  - 0.2 mm layers, 3 walls, 15-20 % infill


  - PLA or PETG; for two-colour text, change filament at the layer where the text starts (the raised text
  starts at 3 mm)



  **Notes**



  - The key ring hole is 5 mm; it fits a standard split ring. Measure your own ring before printing a
  large batch


  - Blank tags are for a permanent marker, a paint pen or a sticker


  - These tags do not include names, logos or characters of any brand

  '
