  description: 'A ribbed pumpkin lantern for standard LED tealights. Four face styles,
    a removable stem lid and a small size for table decorations.


    **Included (6 files)**

    - Classic, happy, spooky and cat faces (90 mm)

    - Small classic pumpkin (70 mm)

    - Stem lid that sits in the top opening


    **Print settings**

    - As oriented; the slicer report below lists which files need supports (only the
    face openings)

    - 0.2 mm layers, 2 walls, 10 % infill

    - Orange PLA looks classic; white or translucent filament glows brighter


    **Use LED tealights only**, never real candles: plastic softens and can burn.


    **Sized to real-world standards**

    - Opening 41 mm (verified on the mesh) for standard 38 mm LED tealights

    - Lid plug 40.2 mm: 0.4 mm gap per side, sits without wobbling

    '
