  description: 'Five Christmas cookie cutters in one file pack: tree, star, bell, gingerbread
    person and round bauble. Each has a wide pressing flange so it is comfortable to push into
    dough.


    **Included (5 files)**


    - Christmas tree, 75 mm tall

    - Star, 75 mm

    - Bell, 75 mm

    - Gingerbread person, 85 mm

    - Round bauble with cap, 80 mm


    **Print settings**


    - No supports: print with the flange on the bed (as oriented)

    - 0.2 mm layers, 3 walls

    - Cutting wall 1.2 mm, flange 4 mm wide, total height 16 mm


    **Sizes**


    - The numbers above are the cookie size inside the cutter; the outer size including wall
    and flange is about 10 mm larger

    - The 16 mm height cuts through typical 5-10 mm rolled dough


    **Food contact:** 3D printed plastic has tiny gaps between layers where bacteria can stay.
    Use these for cutting dough only (briefly, then wash by hand), not as a long-term food container.
    Dust the cutter with flour first.

    '
