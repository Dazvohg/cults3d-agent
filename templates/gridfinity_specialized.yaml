  description: 'Specialised Gridfinity-compatible holders instead of plain bins: every
    screwdriver bit and battery stands upright in its own hole, so you see at a glance
    what is missing.


    **Included (6 files)**

    - 1/4" hex bit holders: 1×1 (9 bits), 2×1 (21 bits), 3×2 (77 bits)

    - AA battery holders: 2×1 (8 batteries) and 2×2 (16 batteries), 20 mm deep holes

    - AAA battery holder: 2×1 (10 batteries)


    **Details**

    - Standard 42 mm grid and 7 mm height units; no label shelf, so nothing gets in
    the way of tall bits or batteries

    - Hex holes are sized with clearance for 1/4" (6.35 mm) bits; test one small holder
    first, since fit depends on your printer

    - Independent design compatible with the open Gridfinity standard (by Zack Freedman);
    not an official product


    **Print settings**

    - 0.2 mm layers, 2 walls, 15 % infill


    **Sized to real-world standards**

    - 1/4" hex bits (6.35 mm across flats): hex holes 6.75 mm across flats, 0.4 mm
    clearance

    - AA batteries (IEC LR6, max Ø 14.5 mm): 15.1 mm holes. AAA (IEC LR03, max Ø 10.5
    mm): 11.1 mm holes

    - Gridfinity dimensions verified on every file: 41.5 mm per unit, 7 mm height
    units + 4.4 mm lip, standard foot profile

    '
