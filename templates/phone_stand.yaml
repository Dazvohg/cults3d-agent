  description: 'A sturdy phone stand with a charging-cable channel, in three viewing
    angles, plus a version for thick cases and a wide tablet stand.


    **Included (5 files)**

    - Phone stand at 55°, 65° and 75°

    - 65° version with an 18 mm slot for rugged or wallet cases

    - Tablet stand, 150 mm wide


    **Print settings**

    - No supports, print as oriented

    - 0.2 mm layers, 3 walls, 20 % infill


    **Sized to real-world standards**

    - 13 mm slot: phones are 7.5–9 mm thick (iPhone 16 Pro Max 8.25 mm), 10–13 mm
    with a normal case

    - 18 mm slot version for rugged cases (OtterBox Defender class, 15–17 mm)

    - Cable channel 10 mm wide: fits USB-C and Lightning cables (3–4.5 mm) with room
    to spare

    '
