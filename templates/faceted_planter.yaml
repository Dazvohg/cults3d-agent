  description: 'A modern twisted geometric planter with a drainage hole, raised drainage
    channels underneath and a matching saucer for every size.


    **Included (7 files)**

    - For 9 cm nursery pots (7 facets) + saucer

    - For 12 cm nursery pots (9 facets) + saucer

    - For 15 cm nursery pots (12 facets) + saucer

    - For 12 cm nursery pots, 6 facets, straight (no twist)


    Drop the plant in its nursery pot straight in: no repotting.


    **Print settings**

    - No supports

    - 0.2 mm layers, 3 walls, 10 % infill

    - PETG or ASA for outdoor use; PLA or silk PLA indoors


    Water-tightness depends on your printer and settings. Use the saucer and avoid
    over-watering.


    **Sized to real-world standards**

    - Designed around standard nursery pots (9, 12 and 15 cm rim): 14 mm of clearance
    at the narrowest point of the facets, measured at the height where the pot''s
    rim sits (verified on the mesh: Ø104 / Ø134 / Ø164 mm)

    - Inner depth = 0.87 × pot diameter + 6 mm, the typical height of round nursery
    pots

    '
