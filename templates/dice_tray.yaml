  description: 'Keep your dice on the table. A hexagonal rolling tray with a shallow
    recess for a felt or neoprene insert (quieter rolls) and slots to park your dice.


    **Included (4 files)**

    - 160 mm with 6 dice slots in two side pockets

    - 160 mm plain

    - 120 mm travel size

    - 190 mm with 6 dice slots inside (compact footprint, fits 220 mm beds)


    **Print settings**

    - No supports

    - 0.2 mm layers, 3 walls, 15 % infill

    - Glue in 1 mm felt cut to the recess for a quiet, premium feel


    **Sized to real-world standards**

    - Slots 26 × 26 mm: real polyhedral sets measure d6 16–18 mm and d20 23–26 mm
    (standard acrylic), so every die of a set fits

    - Felt recess 1 mm deep for standard 1 mm craft felt

    '
