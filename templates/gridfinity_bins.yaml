  description: 'A starter pack of Gridfinity-compatible bins for drawers, workbenches
    and desks. Every bin has a front scoop so small parts slide out easily and a back
    label shelf.


    **Included (8 files)**

    - 1×1 (3 and 6 units tall), 2×1 (3 and 6 units), 2×2, 3×1 with 2 dividers, 3×2
    with 2 dividers, 4×1 with 3 dividers


    **Details**

    - Standard 42 mm grid and 7 mm height units, with a stacking lip on top

    - Fits standard Gridfinity baseplates (the open standard created by Zack Freedman)

    - This is an independent design; it is not an official Gridfinity product

    - Baseplates vary slightly: print one 1×1 bin first to check the fit on yours


    **Print settings**

    - Print as oriented

    - 0.2 mm layers, 2 walls, 10 % infill

    - PLA or PETG


    **Sized to real-world standards**

    - Gridfinity dimensions verified on every file: 41.5 mm footprint per unit (42
    mm grid − 0.5 mm clearance), height = 7 mm × units + 4.4 mm lip

    - Foot profile per the open standard: 0.8 mm @45°, 1.8 mm vertical, 2.15 mm @45°;
    outline 35.6 → 37.2 → 41.5 mm

    - Inner floor at 7 mm, so usable depth = (units − 1) × 7 mm like any standard
    bin

    '
