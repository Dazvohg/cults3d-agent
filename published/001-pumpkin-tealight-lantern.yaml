description: 'A ribbed pumpkin lantern for standard LED tealights. Four face styles,
  a removable stem lid and a small size for table decorations.


  **Included (6 files)**

  - Classic, happy, spooky and cat faces (90 mm)

  - Small classic pumpkin (70 mm)

  - Stem lid that sits in the top opening


  **Print settings**

  - As oriented; the slicer report below lists which files need supports (only the
  face openings)

  - 0.2 mm layers, 2 walls, 10 % infill

  - Orange PLA looks classic; white or translucent filament glows brighter


  **Use LED tealights only**, never real candles: plastic softens and can burn.


  **Sized to real-world standards**

  - Opening 41 mm (verified on the mesh) for standard 38 mm LED tealights

  - Lid plug 40.2 mm: 0.4 mm gap per side, sits without wobbling


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - pumpkin_classic_face: 3 h 34 min, 76 g, supports needed

  - pumpkin_happy_face: 3 h 34 min, 77 g, supports needed

  - pumpkin_spooky_face: 3 h 31 min, 77 g, minimal supports (2.6 % of material)

  - pumpkin_cat_face: 3 h 35 min, 77 g, supports needed

  - pumpkin_lid_stem: 27 min, 9 g, no supports

  - pumpkin_small_classic: 2 h 13 min, 39 g, supports needed

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - pumpkin_classic_face: 89.9 × 86.5 × 71 mm (3.5 × 3.4 × 2.8 in)

  - pumpkin_happy_face: 89.9 × 86.5 × 71 mm (3.5 × 3.4 × 2.8 in)

  - pumpkin_spooky_face: 89.9 × 86.5 × 71 mm (3.5 × 3.4 × 2.8 in)

  - pumpkin_cat_face: 89.9 × 86.5 × 71 mm (3.5 × 3.4 × 2.8 in)

  - pumpkin_lid_stem: 50 × 50 × 26.7 mm (2.0 × 2.0 × 1.1 in)

  - pumpkin_small_classic: 69.9 × 67.3 × 56 mm (2.8 × 2.6 × 2.2 in)'
