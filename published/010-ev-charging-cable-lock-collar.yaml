description: 'A two-part clamp that grips the cable and gives you two eyes for a padlock
  or a chain. Fix it to the cable near the plug and chain it to a post, a ring or
  the charger bracket, and a casual thief has to stop and cut it.


  **Please read this first**


  - This is a plastic part. It is a visible deterrent, NOT a security lock. A determined
  person cuts it in seconds. The real protection is the steel chain and padlock that
  you add

  - It does not lock the plug into the car. It holds the cable


  **Included (8 files, one per cable size)**


  - Cable diameters 12, 14, 16, 18, 20, 22, 24 and 26 mm

  - Each file has both halves on one plate. Print it once and you have the full collar


  **You also need (not included)**


  - 2 bolts M5 x 35 mm with nuts (the head sits in a round pocket, the nut in a hex
  pocket)

  - A padlock or a chain. The eyes are 13 mm wide, so a shackle up to 10 mm passes
  through


  **How to choose the size**


  - Measure the outside diameter of your cable with calipers, or wrap a string once
  around it and divide the length by 3.14

  - Take the file with the same number. The bore is 0.6 mm smaller than the cable
  so that the halves grip the jacket

  - A strip of rubber from a bicycle inner tube between cable and collar gives more
  grip

  - Cable sizes vary a lot between brands and between 16 A and 32 A cables. This listing
  does NOT claim a fit for any car or charger model. Message me your measurement if
  it is between sizes


  **Print settings**


  - No supports: flat on the bed, outer side up, as oriented

  - 0.2 mm layers, 5 walls, 30 % infill

  - PETG or ASA for outdoors. PLA is not recommended in the sun


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - ev_cable_lock_collar_for_12mm_cable: 1 h 19 min, 26 g, no supports

  - ev_cable_lock_collar_for_14mm_cable: 1 h 21 min, 27 g, no supports

  - ev_cable_lock_collar_for_16mm_cable: 1 h 24 min, 29 g, no supports

  - ev_cable_lock_collar_for_18mm_cable: 1 h 28 min, 30 g, no supports

  - ev_cable_lock_collar_for_20mm_cable: 1 h 32 min, 32 g, no supports

  - ev_cable_lock_collar_for_22mm_cable: 1 h 37 min, 34 g, no supports

  - ev_cable_lock_collar_for_24mm_cable: 1 h 41 min, 36 g, no supports

  - ev_cable_lock_collar_for_26mm_cable: 1 h 45 min, 37 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - ev_cable_lock_collar_for_12mm_cable: 71.4 × 88 × 11.7 mm (2.8 × 3.5 × 0.5 in)

  - ev_cable_lock_collar_for_14mm_cable: 73.4 × 88 × 12.7 mm (2.9 × 3.5 × 0.5 in)

  - ev_cable_lock_collar_for_16mm_cable: 75.8 × 88 × 13.9 mm (3.0 × 3.5 × 0.5 in)

  - ev_cable_lock_collar_for_18mm_cable: 78.6 × 88 × 15.3 mm (3.1 × 3.5 × 0.6 in)

  - ev_cable_lock_collar_for_20mm_cable: 81.4 × 88 × 16.7 mm (3.2 × 3.5 × 0.7 in)

  - ev_cable_lock_collar_for_22mm_cable: 84.3 × 88 × 18.1 mm (3.3 × 3.5 × 0.7 in)

  - ev_cable_lock_collar_for_24mm_cable: 87.1 × 88 × 19.5 mm (3.4 × 3.5 × 0.8 in)

  - ev_cable_lock_collar_for_26mm_cable: 89.9 × 88 × 21 mm (3.5 × 3.5 × 0.8 in)'
