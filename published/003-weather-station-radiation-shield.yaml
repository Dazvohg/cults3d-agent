description: 'A passive solar radiation shield for outdoor temperature and humidity
  sensors. Louver plates stacked on three threaded rods keep direct sun and rain off
  the sensor while letting air flow through, so the reading follows the air instead
  of the sun.


  **Included (5 files)**


  - Louver plate: print 5 (the file holds 1 plate)

  - Cap (roof): print 1

  - Spacers: 18 sleeves on one plate, print 1

  - Base for a DHT22 / AM2302 sensor (6 mm cable hole through the floor)

  - Base for a 6 mm DS18B20 stainless probe


  **You also need**


  - 3 x M4 threaded rod, 100 mm

  - 6 x M4 nuts and 6 x M4 washers

  - A zip tie or sealant to fix the sensor


  **Print settings**


  - No supports: every part prints as oriented

  - 0.2 mm layers, 3 walls, 15 % infill

  - Print in white or light grey ASA or PETG. Dark or plain PLA absorbs sun and softens
  outdoors

  - Whole kit: about 11 hours of printing and 290 g of filament (5 plates, cap, spacers
  and one base)


  **Dimensions**


  - 116 mm wide, about 90 mm tall once stacked (rod ends sticking out a little more)

  - Plate pitch 14 mm, cones at 50 degrees, 40 mm central chimney for the sensor

  - DHT22 pocket 15.7 x 25.6 mm for the 15.1 x 25 x 7.7 mm sensor body

  - Probe hole 6.4 mm for a 6 mm stainless probe

  - Rod holes 4.5 mm for M4


  **Honest note:** this is a passive louver design. It reduces solar heating of the
  sensor, but I have not measured it against a reference thermometer, so do not use
  it for certified measurements. Mount it in open air, away from walls and roofs.


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - shield_louver_plate_print_5: 1 h 19 min, 40 g, no supports

  - shield_cap_roof_print_1: 1 h 33 min, 46 g, no supports

  - shield_spacers_x18_print_1: 1 h 27 min, 8 g, no supports

  - shield_base_for_DHT22_sensor: 1 h 14 min, 33 g, no supports

  - shield_base_for_DS18B20_probe_6mm: 1 h 17 min, 33 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - shield_louver_plate_print_5: 116 × 116 × 38.3 mm (4.6 × 4.6 × 1.5 in)

  - shield_cap_roof_print_1: 116 × 116 × 62.1 mm (4.6 × 4.6 × 2.4 in)

  - shield_spacers_x18_print_1: 63 × 30 × 10.3 mm (2.5 × 1.2 × 0.4 in)

  - shield_base_for_DHT22_sensor: 116 × 116 × 10 mm (4.6 × 4.6 × 0.4 in)

  - shield_base_for_DS18B20_probe_6mm: 116 × 116 × 10 mm (4.6 × 4.6 × 0.4 in)'
