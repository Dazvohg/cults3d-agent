description: 'A sturdy phone stand with a charging-cable channel, in three viewing
  angles, plus a version for thick cases and a wide tablet stand.


  **Included (5 files)**

  - Phone stand at 55°, 65° and 75°

  - 65° version with an 18 mm slot for rugged or wallet cases

  - Tablet stand, 150 mm wide


  **Print settings**

  - No supports, print as oriented

  - 0.2 mm layers, 3 walls, 20 % infill


  **Sized to real-world standards**

  - 13 mm slot: phones are 7.5–9 mm thick (iPhone 16 Pro Max 8.25 mm), 10–13 mm with
  a normal case

  - 18 mm slot version for rugged cases (OtterBox Defender class, 15–17 mm)

  - Cable channel 10 mm wide: fits USB-C and Lightning cables (3–4.5 mm) with room
  to spare


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - phone_stand_65deg: 3 h 42 min, 93 g, no supports

  - phone_stand_55deg_low: 3 h 11 min, 80 g, no supports

  - phone_stand_75deg_upright: 3 h 57 min, 98 g, no supports

  - phone_stand_thick_case_18mm: 3 h 34 min, 90 g, no supports

  - tablet_stand_150mm: 10 h 19 min, 256 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - phone_stand_65deg: 85 × 80 × 86.6 mm (3.3 × 3.1 × 3.4 in)

  - phone_stand_55deg_low: 85 × 80 × 70.5 mm (3.3 × 3.1 × 2.8 in)

  - phone_stand_75deg_upright: 85 × 80 × 91.9 mm (3.3 × 3.1 × 3.6 in)

  - phone_stand_thick_case_18mm: 85 × 80 × 86.6 mm (3.3 × 3.1 × 3.4 in)

  - tablet_stand_150mm: 110 × 150 × 112 mm (4.3 × 5.9 × 4.4 in)'
