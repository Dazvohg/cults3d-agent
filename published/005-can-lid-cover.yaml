description: 'Keep bugs, dust and spills out of your drink. A snap-on cover for aluminium
  beverage cans, with or without a straw hole.


  **Included (5 files)**


  - Standard 12 oz can (202 end, 54 mm), solid

  - Standard 12 oz can, 8 mm straw hole

  - Slim / 8 oz can (200 end, 50.8 mm), solid

  - Slim / 8 oz can, 8 mm straw hole

  - Sleek can (204 end, 57.2 mm), solid


  **Print settings**


  - No supports: print with the flat top on the bed (as oriented)

  - 0.2 mm layers, 3 walls, 15 % infill

  - PETG recommended: the snap bead flexes slightly instead of cracking


  **Sized to can-end standards**


  - Inner diameter = can end size + 0.8 mm for FDM tolerance (202 = 2 2/16 in, 200
  = 2 0/16 in, 204 = 2 4/16 in)

  - Snap bead sits just under the can seam

  - Straw hole 8 mm: fits standard 6 mm straws


  **Note:** can makers vary by a fraction of a millimetre, so check your brand with
  one lid first. If it is loose or tight, tell me the can and I will adjust it.


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - can_lid_202_standard_solid: 21 min, 10 g, no supports

  - can_lid_202_standard_straw_hole: 22 min, 10 g, no supports

  - can_lid_200_slim_solid: 19 min, 10 g, no supports

  - can_lid_200_slim_straw_hole: 20 min, 9 g, no supports

  - can_lid_204_sleek_solid: 22 min, 11 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - can_lid_202_standard_solid: 58 × 58 × 14 mm (2.3 × 2.3 × 0.6 in)

  - can_lid_202_standard_straw_hole: 58 × 58 × 14 mm (2.3 × 2.3 × 0.6 in)

  - can_lid_200_slim_solid: 54.8 × 54.8 × 14 mm (2.2 × 2.2 × 0.6 in)

  - can_lid_200_slim_straw_hole: 54.8 × 54.8 × 14 mm (2.2 × 2.2 × 0.6 in)

  - can_lid_204_sleek_solid: 61.2 × 61.2 × 14 mm (2.4 × 2.4 × 0.6 in)'
