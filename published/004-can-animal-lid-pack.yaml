description: 'Turn any soda can into a little animal. A snap-on cover that keeps bugs,
  dust and spills out of your drink, with a cat, frog, bat or bear face on top. Four
  animals, three can sizes.


  **Included (12 STL files, ready to print)**


  - Cat, frog, bat and bear

  - Each one for standard 12 oz cans (202 end, 54 mm), slim 8 oz cans (200 end, 50.8
  mm) and sleek cans (204 end, 57.2 mm)

  - Plus a print-ready 3MF bundle


  **Print settings**


  - No supports: print with the animal face on the bed (as oriented)

  - 0.2 mm layers, 3 walls, 15 % infill

  - PETG recommended: the snap bead flexes slightly instead of cracking

  - Single colour is fine; the face is engraved lines, so no multi-colour setup is
  needed


  **Sized to can-end standards**


  - Inner diameter = can end size + 0.8 mm for FDM tolerance (202 = 2 2/16 in, 200
  = 2 0/16 in, 204 = 2 4/16 in)

  - Snap bead sits just under the can seam

  - The ears, wings and frog eyes are flat parts in the same plane as the lid top,
  so everything prints without supports


  **Note:** can makers vary by a fraction of a millimetre, so check your brand with
  one lid first. If it is loose or tight, tell me the can and I will adjust it. The
  wings of the bat are about 103 mm wide in total.


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - can_lid_cat_202_standard: 26 min, 11 g, no supports

  - can_lid_cat_200_slim: 24 min, 10 g, no supports

  - can_lid_cat_204_sleek: 27 min, 12 g, no supports

  - can_lid_frog_202_standard: 24 min, 11 g, no supports

  - can_lid_frog_200_slim: 22 min, 10 g, no supports

  - can_lid_frog_204_sleek: 25 min, 12 g, no supports

  - can_lid_bat_202_standard: 28 min, 13 g, no supports

  - can_lid_bat_200_slim: 25 min, 12 g, no supports

  - can_lid_bat_204_sleek: 31 min, 14 g, no supports

  - can_lid_bear_202_standard: 25 min, 11 g, no supports

  - can_lid_bear_200_slim: 23 min, 10 g, no supports

  - can_lid_bear_204_sleek: 27 min, 12 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - can_lid_cat_202_standard: 58 × 60.7 × 14 mm (2.3 × 2.4 × 0.6 in)

  - can_lid_cat_200_slim: 54.8 × 57.4 × 14 mm (2.2 × 2.3 × 0.6 in)

  - can_lid_cat_204_sleek: 61.2 × 64.1 × 14 mm (2.4 × 2.5 × 0.6 in)

  - can_lid_frog_202_standard: 58 × 61.2 × 14 mm (2.3 × 2.4 × 0.6 in)

  - can_lid_frog_200_slim: 54.8 × 57.8 × 14 mm (2.2 × 2.3 × 0.6 in)

  - can_lid_frog_204_sleek: 61.2 × 64.6 × 14 mm (2.4 × 2.5 × 0.6 in)

  - can_lid_bat_202_standard: 103.2 × 65.4 × 14 mm (4.1 × 2.6 × 0.6 in)

  - can_lid_bat_200_slim: 97.5 × 61.8 × 14 mm (3.8 × 2.4 × 0.6 in)

  - can_lid_bat_204_sleek: 108.9 × 69 × 14 mm (4.3 × 2.7 × 0.6 in)

  - can_lid_bear_202_standard: 58 × 59.8 × 14 mm (2.3 × 2.4 × 0.6 in)

  - can_lid_bear_200_slim: 54.8 × 56.5 × 14 mm (2.2 × 2.2 × 0.6 in)

  - can_lid_bear_204_sleek: 61.2 × 63.1 × 14 mm (2.4 × 2.5 × 0.6 in)'
