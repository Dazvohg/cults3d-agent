description: 'Connect a portable air-conditioner exhaust hose to a different hose,
  a window kit or a 4 in dryer-vent duct. Five adapters with grip ridges on each end.


  **Included (5 files)**


  - 150 mm to 130 mm reducer

  - 130 mm to 102 mm (4 in dryer vent) reducer

  - 150 mm to 102 mm (4 in dryer vent) reducer

  - 130 mm straight coupler (joins two hoses)

  - 150 mm straight coupler


  **Measure your hose first (2 minutes)**


  The number in each file name is the OUTER diameter of that end. Hoses are sold as
  "5 in" or "5.9 in", but fittings vary by brand. Measure the INSIDE diameter of your
  hose end (calipers, or wrap a string around the inside and divide the length by
  3.14) and pick the file whose size matches it within about 2 mm: flexible hose stretches
  a little. If your hose is a different size, message me with the measurement and
  I will adapt the file.


  **Print settings**


  - No supports: print standing on the large end, as oriented

  - 0.2 mm layers, 4 walls, 15 % infill

  - PETG recommended: exhaust air is warm. Plain PLA softens above about 55 C


  **Dimensions**


  - Wall 2.2 mm, spigots 40 mm long, 1 mm grip ridges on each end

  - Cone transition about 39 degrees from vertical, so it prints without supports

  - Largest part: 152 mm wide, fits a 220 mm bed


  **Not a sealed fitting:** these are friction fits. For a tighter seal, wrap the
  joint with aluminium tape.


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - ac_hose_adapter_150mm_to_130mm_reducer: 2 h 53 min, 108 g, no supports

  - ac_hose_adapter_130mm_to_102mm_dryer_vent_4in: 2 h 31 min, 94 g, no supports

  - ac_hose_adapter_150mm_to_102mm_dryer_vent_4in: 3 h 05 min, 116 g, no supports

  - ac_hose_adapter_130mm_coupler: 2 h 23 min, 87 g, no supports

  - ac_hose_adapter_150mm_coupler: 2 h 51 min, 101 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - ac_hose_adapter_150mm_to_130mm_reducer: 152 × 152 × 92.5 mm (6.0 × 6.0 × 3.6 in)

  - ac_hose_adapter_130mm_to_102mm_dryer_vent_4in: 132 × 132 × 97.5 mm (5.2 × 5.2
  × 3.8 in)

  - ac_hose_adapter_150mm_to_102mm_dryer_vent_4in: 152 × 152 × 110 mm (6.0 × 6.0 ×
  4.3 in)

  - ac_hose_adapter_130mm_coupler: 132 × 132 × 80 mm (5.2 × 5.2 × 3.1 in)

  - ac_hose_adapter_150mm_coupler: 152 × 152 × 80 mm (6.0 × 6.0 × 3.1 in)'
