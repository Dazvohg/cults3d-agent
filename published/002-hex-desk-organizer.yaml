description: 'A clean honeycomb organizer for pens, brushes, tools and makeup. Cells
  of different heights make everything easy to reach and look great on any desk.


  **What you get**

  - 5-cell cluster (188 × 128 × 100 mm)

  - 3-cell cluster

  - 7-cell cluster (smaller 50 mm cells, fits a 220 × 220 bed)

  - Single hex cup, print as many as you like


  **Print settings**

  - No supports, no brim needed

  - 0.2 mm layers, 2–3 walls, 10–15 % infill

  - PLA or PETG. Try vase-mode-like multicolor filament for a great look

  - Small bottom chamfer to prevent elephant''s foot


  Designed and tested for FDM printers with a 220 × 220 mm bed or larger.


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - hex_organizer_5cells: 7 h 17 min, 202 g, no supports

  - hex_organizer_3cells: 4 h 24 min, 129 g, no supports

  - hex_organizer_7cells: 8 h 31 min, 220 g, no supports

  - hex_single_cup: 1 h 52 min, 59 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - hex_organizer_5cells: 188 × 127.6 × 100 mm (7.4 × 5.0 × 3.9 in)

  - hex_organizer_3cells: 126 × 127.6 × 100 mm (5.0 × 5.0 × 3.9 in)

  - hex_organizer_7cells: 158 × 152.4 × 110 mm (6.2 × 6.0 × 4.3 in)

  - hex_single_cup: 64 × 73.9 × 100 mm (2.5 × 2.9 × 3.9 in)'
