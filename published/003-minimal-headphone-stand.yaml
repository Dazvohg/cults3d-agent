description: 'A minimalist headphone stand that prints lying flat, so layer lines
  run along the load path: strong and support-free.


  **Features**

  - Arched saddle protects the headband padding

  - End lip keeps headphones from sliding off

  - Triangulated base for stability

  - About 210 mm tall, fits 220 × 220 mm print beds


  **Files**

  - 230 mm, 50 mm wide (needs a 256 × 256 mm bed: Bambu Lab A1 / P1S / X1C)

  - 230 mm, 60 mm wide for heavier gaming headsets (256 mm bed)

  - 195 mm compact version for 220 × 220 mm beds (Ender-3 class)


  **Print settings**

  - Print flat, no supports

  - 0.2 mm layers, 3–4 walls, 15–20 % gyroid infill

  - PLA or PETG, about 110–130 g of filament


  **Sized to real-world standards**

  - Height based on real over-ear headphones: ~185–220 mm tall (AirPods Max 187 mm),
  so the 230 mm hanger keeps the cups off the desk

  - Saddle 50 or 60 mm wide, wider than common headbands (30–45 mm)


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - headphone_stand_230mm: 6 h 16 min, 153 g, no supports

  - headphone_stand_230mm_wide_60mm: 7 h 27 min, 181 g, no supports

  - headphone_stand_195mm_compact: 5 h 54 min, 143 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - headphone_stand_230mm: 171 × 244 × 50 mm (6.7 × 9.6 × 2.0 in) - needs a 256 x
  256 mm bed

  - headphone_stand_230mm_wide_60mm: 171 × 244 × 60 mm (6.7 × 9.6 × 2.4 in) - needs
  a 256 x 256 mm bed

  - headphone_stand_195mm_compact: 171 × 209 × 50 mm (6.7 × 8.2 × 2.0 in)'
