description: 'Keep charging cables from falling behind the desk. Stick the flat base
  with double-sided tape and snap your cables in.


  **Included sizes** (by real cable diameter)

  - 3 slots / 4.5 mm: braided and thick USB-C cables

  - 1 slot / 6 mm: laptop chargers

  - 5 slots / 3.5 mm: standard phone cables (USB-C, Lightning)

  - 2 slots / 8 mm: HDMI and monitor cables


  **Print settings**

  - Print flat as oriented, no supports

  - 0.2 mm layers, 100 % infill (parts are tiny)

  - PETG recommended for a springier snap; PLA works fine


  Need a different cable diameter or slot count? Leave a comment and I will add it.


  **Sized to real-world standards**

  - Slot diameters follow common cable jackets: 3.5 mm (phone), 4.5 mm (braided USB-C),
  6 mm (laptop), 8 mm (HDMI); +0.2 mm so the cable slides

  - Snap mouth = 72 % of the cable diameter: holds firmly, releases without tools


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - cable_clip_3slots_4.5mm_usbc: 15 min, 2 g, no supports

  - cable_clip_1slot_6mm_laptop: 7 min, 1 g, no supports

  - cable_clip_5slots_3.5mm_phone: 21 min, 3 g, no supports

  - cable_clip_2slots_8mm_hdmi: 15 min, 2 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - cable_clip_3slots_4.5mm_usbc: 32.5 × 12 × 9.1 mm (1.3 × 0.5 × 0.4 in)

  - cable_clip_1slot_6mm_laptop: 15 × 12 × 10.4 mm (0.6 × 0.5 × 0.4 in)

  - cable_clip_5slots_3.5mm_phone: 46.5 × 12 × 8.2 mm (1.8 × 0.5 × 0.3 in)

  - cable_clip_2slots_8mm_hdmi: 30 × 12 × 12.2 mm (1.2 × 0.5 × 0.5 in)'
