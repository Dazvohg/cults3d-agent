description: 'A dice tower that actually works for big dice. Every ramp leaves a 31
  mm gap, so a d20 (up to 29 mm) never jams, and the dice land in a rolling tray with
  a rim.


  **Included (2 files)**

  - Tall tower, 3 ramps (76 x 112 x 192 mm)

  - Compact tower, 2 ramps (76 x 112 x 146 mm)


  **Print settings**

  - Ramps are 45 degrees and the exit window is a gable, so support needs are minimal
  (see the slicer notes below)

  - 0.2 mm layers, 3 walls, 15 % infill

  - PLA or PETG


  **Sized to real-world standards**

  - Chamber 70 x 36 mm, gap 31 mm vs d20 23-29 mm

  - Footprint fits a 220 mm bed


  Great for D&D, Pathfinder, board games and wargames.


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - dice_tower_tall_3_ramps: 6 h 11 min, 180 g, supports needed

  - dice_tower_compact_2_ramps: 4 h 46 min, 139 g, supports needed

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - dice_tower_tall_3_ramps: 76 × 112 × 192 mm (3.0 × 4.4 × 7.6 in)

  - dice_tower_compact_2_ramps: 76 × 112 × 146 mm (3.0 × 4.4 × 5.7 in)'
