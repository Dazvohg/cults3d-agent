description: 'A wide hopper that drops into your portafilter basket so ground coffee
  goes into the basket instead of onto the counter. Five files: four portafilter sizes
  plus a taller version for the 58 mm.


  **Included (5 files)**


  - 51 mm portafilter

  - 53 mm portafilter

  - 54 mm portafilter

  - 58 mm portafilter

  - 58 mm with a taller collar (extra room for a heaped dose)


  **Print settings**


  - No supports: print standing on the plug ring, as oriented

  - 0.2 mm layers, 3 walls, 15 % infill

  - PETG or PLA. Hand wash only, no dishwasher


  **How it fits**


  - The plug ring is 1 mm under the nominal size (for example 57 mm for a 58 mm portafilter),
  so it always drops in without forcing

  - A 45 degree seat rests on the basket edge and centres the funnel

  - The hopper is about 40 mm wider than the basket and leans out at 39 degrees, so
  grounds slide down


  **Check your size first:** "51, 53, 54, 58 mm" are the nominal sizes sold by most
  machine brands. The inside of the basket can vary by about half a millimetre between
  brands. If your funnel is loose or tight, message me with the basket diameter and
  I will adapt the file.


  **Not included:** no magnets. This is a simple plug-in funnel.


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - dosing_funnel_51mm: 44 min, 25 g, no supports

  - dosing_funnel_53mm: 45 min, 26 g, no supports

  - dosing_funnel_54mm: 45 min, 26 g, no supports

  - dosing_funnel_58mm: 48 min, 28 g, no supports

  - dosing_funnel_58mm_tall_collar: 1 h 12 min, 45 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - dosing_funnel_51mm: 91.6 × 91.6 × 38 mm (3.6 × 3.6 × 1.5 in)

  - dosing_funnel_53mm: 93.6 × 93.6 × 38 mm (3.7 × 3.7 × 1.5 in)

  - dosing_funnel_54mm: 94.6 × 94.6 × 38 mm (3.7 × 3.7 × 1.5 in)

  - dosing_funnel_58mm: 98.6 × 98.6 × 38 mm (3.9 × 3.9 × 1.5 in)

  - dosing_funnel_58mm_tall_collar: 98.6 × 98.6 × 56 mm (3.9 × 3.9 × 2.2 in)'
