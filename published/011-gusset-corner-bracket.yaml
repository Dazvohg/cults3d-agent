description: 'L-shaped corner brackets with a gusset on each side and a free centre
  channel, so the screwdriver reaches every countersunk hole straight on.


  **Included (5 files)**

  - 40 mm, 20 mm wide, 1 hole per arm, M3

  - 60 mm, 30 mm wide, 1 or 2 holes per arm, M4

  - 80 mm, 40 mm wide, 2 holes per arm, M5

  - 100 mm, 40 mm wide, 2 holes per arm, M5


  **Oriented for easy printing**

  The files stand on their base: the side gussets become vertical walls, so the only
  overhangs are small areas around the holes (see the slicer report below). An inner
  corner fillet spreads the load where brackets usually crack.


  **Print settings**

  - As oriented (standing on the base)

  - 0.2 mm layers, 4–6 walls, 40 % gyroid infill

  - PETG or ASA for workshop or outdoor use; PLA for light indoor use


  **Please note:** 3D-printed parts vary with printer, material and settings. These
  brackets are meant for light and medium duty (small shelves, frames, boxes, cable
  trays). Test your print before loading it, and do not use it for overhead, safety-critical
  or heavy loads.


  **Sized to real-world standards**

  - Countersinks follow ISO 10642 head diameters (M3 6.72 / M4 8.96 / M5 11.2 mm)
  + 0.4 mm, so heads sit flush

  - Clearance holes per ISO 273 medium series: 3.4 / 4.5 / 5.5 mm. The M4 and M5 holes
  also take 4 and 5 mm wood screws

  - Holes on the vertical arm are teardrop-shaped at the top so they print round without
  supports


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - bracket_60mm_w30_M4_2holes: 58 min, 23 g, no supports

  - bracket_40mm_w20_M3: 28 min, 10 g, no supports

  - bracket_60mm_w30_M4: 55 min, 23 g, no supports

  - bracket_80mm_w40_M5_2holes: 1 h 47 min, 43 g, no supports

  - bracket_100mm_w40_M5_2holes: 2 h 26 min, 61 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - bracket_60mm_w30_M4_2holes: 60 × 30 × 60 mm (2.4 × 1.2 × 2.4 in)

  - bracket_40mm_w20_M3: 40 × 20 × 40 mm (1.6 × 0.8 × 1.6 in)

  - bracket_60mm_w30_M4: 60 × 30 × 60 mm (2.4 × 1.2 × 2.4 in)

  - bracket_80mm_w40_M5_2holes: 80 × 40 × 80 mm (3.1 × 1.6 × 3.1 in)

  - bracket_100mm_w40_M5_2holes: 100 × 40 × 100 mm (3.9 × 1.6 × 3.9 in)'
