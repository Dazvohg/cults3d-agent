description: 'Move whole squads in one go and stop knocking miniatures over. Eight
  ready-to-print trays for the most common round base sizes, with optional magnet
  pockets.


  **Included trays**

  - 25 mm bases: 5×2, 5×2 with pockets for 5×2 mm magnets, 4×4 regiment block

  - 28.5 mm bases (sold as "28 mm"): 5×2

  - 32 mm bases: 5×2, 5×2 with pockets for 6×2 mm magnets, 3×2 staggered skirmish
  formation

  - 40 mm bases: 3×2


  **Details**

  - 0.6 mm clearance so bases drop in and lift out easily

  - Chamfered pockets and rim, finger notches on both sides

  - Magnet version fits 5 × 2 mm neodymium magnets (glue them in)

  - Compatible with any game that uses round bases


  **Print settings**

  - No supports, print flat

  - 0.2 mm layers, 3 walls, 15 % infill, about 10–25 g per tray

  - PLA or PETG; a dark or textured bed plate looks great on the table


  Need another base size or layout? Leave a comment and I will add it for free.


  **Sized to real-world standards**

  - Pockets for the standard round bases used by Games Workshop and most wargames:
  25, 28.5, 32 and 40 mm

  - Pocket diameters are compensated for polygon facets, so the real clearance is
  0.6 mm, not less


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - tray_25mm_5x2: 47 min, 20 g, no supports

  - tray_25mm_5x2_magnets_5x2: 1 h 08 min, 25 g, no supports

  - tray_28.5mm_5x2: 57 min, 25 g, no supports

  - tray_32mm_5x2: 1 h 07 min, 30 g, no supports

  - tray_32mm_5x2_magnets_6x2: 1 h 35 min, 38 g, no supports

  - tray_32mm_3x2_skirmish: 47 min, 22 g, no supports

  - tray_40mm_3x2: 57 min, 27 g, no supports

  - tray_25mm_4x4_regiment: 1 h 11 min, 31 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - tray_25mm_5x2: 138.8 × 58.4 × 3.4 mm (5.5 × 2.3 × 0.1 in)

  - tray_25mm_5x2_magnets_5x2: 138.8 × 58.4 × 4.8 mm (5.5 × 2.3 × 0.2 in)

  - tray_28.5mm_5x2: 156.3 × 65.4 × 3.4 mm (6.2 × 2.6 × 0.1 in)

  - tray_32mm_5x2: 173.8 × 72.4 × 3.4 mm (6.8 × 2.9 × 0.1 in)

  - tray_32mm_5x2_magnets_6x2: 173.8 × 72.4 × 4.8 mm (6.8 × 2.9 × 0.2 in)

  - tray_32mm_3x2_skirmish: 123.1 × 72.4 × 3.4 mm (4.8 × 2.9 × 0.1 in)

  - tray_40mm_3x2: 130.2 × 88.4 × 3.4 mm (5.1 × 3.5 × 0.1 in)

  - tray_25mm_4x4_regiment: 112 × 112 × 3.4 mm (4.4 × 4.4 × 0.1 in)'
