description: 'Keep your deck safe in a box made for sleeved cards. A snug base with
  a sliding cap, a thumb notch to lift the stack, and four sizes sized from real card
  dimensions.


  **Included (8 files = 4 boxes, each a base and a cap)**

  - Standard TCG / poker (66 x 91 mm sleeved), 100 cards (Commander-size)

  - Standard TCG / poker (66 x 91 mm sleeved), 60 cards

  - Mini Euro (47 x 71 mm sleeved), 60 cards

  - Tarot (73 x 123 mm sleeved), 60 cards


  **Print settings**

  - No supports: both parts print open side up

  - 0.2 mm layers, 3 walls, 15 % infill

  - PLA or PETG


  **Sized to real-world standards**

  - Inner space = sleeved card + 1 mm play. Each sleeved card is counted as 0.65 mm
  thick, so double-sleeved decks need a larger count

  - Cap fits over the base with 0.3 mm gap per side (friction fit, no glue)


  Perfect for Magic, Pokemon, board game and D&D spell-card decks.


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - deck_box_tcg_100_sleeved_base: 2 h 04 min, 67 g, no supports

  - deck_box_tcg_100_sleeved_cap: 1 h 00 min, 33 g, no supports

  - deck_box_tcg_60_sleeved_base: 1 h 38 min, 52 g, no supports

  - deck_box_tcg_60_sleeved_cap: 47 min, 25 g, no supports

  - deck_box_mini_euro_60_sleeved_base: 1 h 00 min, 31 g, no supports

  - deck_box_mini_euro_60_sleeved_cap: 39 min, 20 g, no supports

  - deck_box_tarot_60_sleeved_base: 2 h 32 min, 77 g, no supports

  - deck_box_tarot_60_sleeved_cap: 50 min, 27 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - deck_box_tcg_100_sleeved_base: 71.8 × 70.8 × 72.4 mm (2.8 × 2.8 × 2.9 in)

  - deck_box_tcg_100_sleeved_cap: 77.2 × 76.2 × 24.4 mm (3.0 × 3.0 × 1.0 in)

  - deck_box_tcg_60_sleeved_base: 71.8 × 44.8 × 72.4 mm (2.8 × 1.8 × 2.9 in)

  - deck_box_tcg_60_sleeved_cap: 77.2 × 50.2 × 24.4 mm (3.0 × 2.0 × 1.0 in)

  - deck_box_mini_euro_60_sleeved_base: 52.8 × 44.8 × 52.4 mm (2.1 × 1.8 × 2.1 in)

  - deck_box_mini_euro_60_sleeved_cap: 58.2 × 50.2 × 24.4 mm (2.3 × 2.0 × 1.0 in)

  - deck_box_tarot_60_sleeved_base: 78.8 × 44.8 × 104.4 mm (3.1 × 1.8 × 4.1 in)

  - deck_box_tarot_60_sleeved_cap: 84.2 × 50.2 × 24.4 mm (3.3 × 2.0 × 1.0 in)'
