description: 'A modern twisted geometric planter with a drainage hole, raised drainage
  channels underneath and a matching saucer for every size.


  **Included (7 files)**

  - For 9 cm nursery pots (7 facets) + saucer

  - For 12 cm nursery pots (9 facets) + saucer

  - For 15 cm nursery pots (12 facets) + saucer

  - For 12 cm nursery pots, 6 facets, straight (no twist)


  Drop the plant in its nursery pot straight in: no repotting.


  **Print settings**

  - No supports

  - 0.2 mm layers, 3 walls, 10 % infill

  - PETG or ASA for outdoor use; PLA or silk PLA indoors


  Water-tightness depends on your printer and settings. Use the saucer and avoid over-watering.


  **Sized to real-world standards**

  - Designed around standard nursery pots (9, 12 and 15 cm rim): 14 mm of clearance
  at the narrowest point of the facets, measured at the height where the pot''s rim
  sits (verified on the mesh: Ø104 / Ø134 / Ø164 mm)

  - Inner depth = 0.87 × pot diameter + 6 mm, the typical height of round nursery
  pots


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - planter_fits_12cm_pot_9sides: 4 h 30 min, 146 g, no supports

  - saucer_12cm_9sides: 1 h 22 min, 47 g, no supports

  - planter_fits_9cm_pot_7sides: 2 h 52 min, 91 g, no supports

  - saucer_9cm_7sides: 59 min, 33 g, no supports

  - planter_fits_15cm_pot_12sides: 6 h 15 min, 215 g, no supports

  - saucer_15cm_12sides: 1 h 49 min, 62 g, no supports

  - planter_fits_12cm_pot_6sides_straight: 4 h 50 min, 155 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - planter_fits_12cm_pot_9sides: 147 × 144.7 × 113.4 mm (5.8 × 5.7 × 4.5 in)

  - saucer_12cm_9sides: 131.3 × 133.3 × 14 mm (5.2 × 5.2 × 0.6 in)

  - planter_fits_9cm_pot_7sides: 118 × 119 × 87.3 mm (4.6 × 4.7 × 3.4 in)

  - saucer_9cm_7sides: 108.3 × 111 × 14 mm (4.3 × 4.4 × 0.6 in)

  - planter_fits_15cm_pot_12sides: 173.6 × 173.6 × 139.5 mm (6.8 × 6.8 × 5.5 in)

  - saucer_15cm_12sides: 157 × 157 × 14 mm (6.2 × 6.2 × 0.6 in)

  - planter_fits_12cm_pot_6sides_straight: 161.9 × 140.2 × 113.4 mm (6.4 × 5.5 × 4.5
  in)'
