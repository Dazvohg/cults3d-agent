description: 'A modular twist-lock duct system. Every part has a male spigot on one
  end and a socket on the other, so you push them together and twist about 30 degrees
  to lock. Build your own ducting run for a grow tent, a workshop fan, a 3D-printer
  enclosure or a small extractor.


  **Included (12 files, 3 sizes)**


  - Sizes 100 mm (4 in), 125 mm (5 in) and 150 mm (6 in)

  - Straight part, 100 mm of tube between the ends (166 mm tall in total)

  - Short straight part, 50 mm of tube

  - End cap that locks onto any socket of its size

  - Three reducers: 100 mm male to 125 mm socket, 125 to 150 and 100 to 150


  **Print settings**


  - No supports: print standing, male end down, as oriented

  - 0.2 mm layers, 4 walls, 15 % infill

  - PETG or ASA for warm air. PLA softens around 55 C


  **How the sizes work**


  - The male spigot is the nominal size minus 0.6 mm, so it slides INTO a duct or
  fan outlet of that inside diameter. Measure yours first: 100, 125 and 150 mm are
  the usual metric sizes, but flexible ducts vary

  - The socket is 0.4 mm bigger all around than the spigot, with three lugs and three
  L-shaped grooves

  - If your duct is a different size, message me the measurement and I can make the
  set for it


  **Good to know**


  - There are no elbows in this set: for a turn, join two parts with a flexible duct.
  Elbows would need supports and I only list what prints cleanly

  - The twist-lock holds the parts together but it is not airtight. Seal the joints
  with aluminium tape if you need that

  - Not for dryer exhaust, flues or any hot or combustible exhaust

  - Fit depends on your printer. If the parts are tight, scale the lugs or sand them
  lightly


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - ventducts_100mm_straight_100mm: 5 h 00 min, 157 g, no supports

  - ventducts_100mm_straight_50mm: 3 h 36 min, 113 g, no supports

  - ventducts_100mm_end_cap: 1 h 57 min, 57 g, no supports

  - ventducts_125mm_straight_100mm: 6 h 02 min, 197 g, no supports

  - ventducts_125mm_straight_50mm: 4 h 32 min, 141 g, no supports

  - ventducts_125mm_end_cap: 2 h 38 min, 76 g, no supports

  - ventducts_150mm_straight_100mm: 7 h 23 min, 237 g, no supports

  - ventducts_150mm_straight_50mm: 5 h 18 min, 169 g, no supports

  - ventducts_150mm_end_cap: 3 h 17 min, 99 g, no supports

  - ventducts_reducer_100mm_male_to_125mm_socket: 3 h 57 min, 116 g, no supports

  - ventducts_reducer_125mm_male_to_150mm_socket: 4 h 47 min, 142 g, no supports

  - ventducts_reducer_100mm_male_to_150mm_socket: 5 h 58 min, 169 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - ventducts_100mm_straight_100mm: 106.6 × 106.6 × 166 mm (4.2 × 4.2 × 6.5 in)

  - ventducts_100mm_straight_50mm: 106.6 × 106.6 × 116 mm (4.2 × 4.2 × 4.6 in)

  - ventducts_100mm_end_cap: 106.6 × 106.6 × 33 mm (4.2 × 4.2 × 1.3 in)

  - ventducts_125mm_straight_100mm: 131.6 × 131.6 × 166 mm (5.2 × 5.2 × 6.5 in)

  - ventducts_125mm_straight_50mm: 131.6 × 131.6 × 116 mm (5.2 × 5.2 × 4.6 in)

  - ventducts_125mm_end_cap: 131.6 × 131.6 × 33 mm (5.2 × 5.2 × 1.3 in)

  - ventducts_150mm_straight_100mm: 156.6 × 156.6 × 166 mm (6.2 × 6.2 × 6.5 in)

  - ventducts_150mm_straight_50mm: 156.6 × 156.6 × 116 mm (6.2 × 6.2 × 4.6 in)

  - ventducts_150mm_end_cap: 156.6 × 156.6 × 33 mm (6.2 × 6.2 × 1.3 in)

  - ventducts_reducer_100mm_male_to_125mm_socket: 131.6 × 131.6 × 88.1 mm (5.2 × 5.2
  × 3.5 in)

  - ventducts_reducer_125mm_male_to_150mm_socket: 156.6 × 156.6 × 88.1 mm (6.2 × 6.2
  × 3.5 in)

  - ventducts_reducer_100mm_male_to_150mm_socket: 156.6 × 156.6 × 100.6 mm (6.2 ×
  6.2 × 4.0 in)'
