description: 'Five pockets that stick to the side or underside of a desk, a shelf
  or a wall, so phone, pens, remote and keys stay off the table. Each has a flat back
  for double-sided tape and two screw holes with a counterbore.


  **Included (5 files)**


  - Phone pocket, 82 x 13 mm slot (phone with a normal case)

  - Phone pocket for rugged cases, 82 x 18 mm slot

  - Pen cup, 48 x 48 mm, 90 mm tall (about 20 pens)

  - Wide tray for remotes, glasses or cables, 120 x 45 mm, 35 mm tall

  - Small pocket for keys or earbuds, 60 x 30 mm, 40 mm tall


  **Print settings**


  - No supports: print standing, as oriented

  - 0.2 mm layers, 3 walls, 15 % infill

  - PETG or PLA


  **How to mount**


  - Adhesive: clean the surface, stick strong double-sided foam tape (not included)
  on the flat back, press for 30 seconds

  - Screws: two screw holes with a counterbore for 4 mm screws (not included). Use
  screws for heavy loads

  - Adhesive strength depends on the tape and the surface. Test it with a light load
  first and do not hang anything heavy or fragile


  **Sizes**


  - Walls 1.6 mm, floor 2.4 mm, mounting plate 3.2 mm

  - Phone slots: 13 mm for a phone plus normal case (7.5-9 mm phones), 18 mm for rugged
  cases (15-17 mm); 82 mm wide fits the iPhone 16 Pro Max (77.6 mm wide)

  - Every pocket is open at the top and stands on its own floor in the printer


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - desk_pocket_phone_82x13: 1 h 41 min, 44 g, no supports

  - desk_pocket_phone_rugged_82x18: 1 h 44 min, 45 g, no supports

  - desk_pocket_pen_cup_48: 2 h 10 min, 55 g, no supports

  - desk_pocket_tray_remote_120x45: 1 h 58 min, 55 g, no supports

  - desk_pocket_mini_keys_60x30: 1 h 11 min, 30 g, no supports

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - desk_pocket_phone_82x13: 85.2 × 19.4 × 86 mm (3.4 × 0.8 × 3.4 in)

  - desk_pocket_phone_rugged_82x18: 85.2 × 24.4 × 86 mm (3.4 × 1.0 × 3.4 in)

  - desk_pocket_pen_cup_48: 51.2 × 54.4 × 116 mm (2.0 × 2.1 × 4.6 in)

  - desk_pocket_tray_remote_120x45: 123.2 × 51.4 × 61 mm (4.9 × 2.0 × 2.4 in)

  - desk_pocket_mini_keys_60x30: 63.2 × 36.4 × 66 mm (2.5 × 1.4 × 2.6 in)'
