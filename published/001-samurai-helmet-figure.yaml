description: 'A stylised samurai kabuto (helmet) for your desk, shelf or game table.
  Dome bowl, five flared neck-guard tiers, a face opening and a crescent crest, on
  a round base. 100 % original design, no licensed characters.


  **Included (3 files)**

  - 80 mm with crescent crest

  - 80 mm plain

  - 60 mm mini with crest


  **Print settings**

  - No supports, prints upright

  - 0.2 mm layers, 3 walls, 15 % infill

  - Matte black, dark red or silver PLA looks great


  Paint it, or print it in silk metallic PLA as is.


  **Slicer-verified** (PrusaSlicer, 0.4 mm nozzle, 0.2 mm layers, 3 walls, 15 % infill,
  PLA):

  - samurai_helmet_80mm_with_crest: 5 h 00 min, 119 g, supports needed

  - samurai_helmet_80mm_plain: 4 h 53 min, 117 g, supports needed

  - samurai_helmet_60mm_mini: 2 h 49 min, 67 g, supports needed

  - Each file is also included as an oriented, ready-to-slice .3mf (opens in Bambu
  Studio, OrcaSlicer and PrusaSlicer).


  **Sizes** (W × D × H):

  - samurai_helmet_80mm_with_crest: 128 × 128 × 74 mm (5.0 × 5.0 × 2.9 in)

  - samurai_helmet_80mm_plain: 128 × 128 × 69.2 mm (5.0 × 5.0 × 2.7 in)

  - samurai_helmet_60mm_mini: 96 × 96 × 63 mm (3.8 × 3.8 × 2.5 in)'
