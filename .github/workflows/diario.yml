name: Tareas diarias (descuentos y productos de temporada)

on:
  schedule:
    # Todos los días 09:07 hora de Buenos Aires (12:07 UTC)
    - cron: "7 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cults-publish
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Descuentos que empiezan hoy (Black Friday, Navidad...)
        if: ${{ !hashFiles('PAUSED') }}
        env:
          CULTS_USERNAME: ${{ secrets.CULTS_USERNAME }}
          CULTS_API_KEY: ${{ secrets.CULTS_API_KEY }}
        run: python tools/descuentos.py --aplicar

      - name: Productos de temporada cuya ventana se abrió
        run: python tools/calendario.py --generar

      - name: Guardar cambios
        run: |
          git config user.name "cults-bot"
          git config user.email "cults-bot@users.noreply.github.com"
          git add -A queue descuentos_aplicados.csv 2>/dev/null || git add -A queue
          git diff --cached --quiet || (git commit -m "Tareas diarias: temporada y descuentos" && git push)
